<!DOCTYPE html>
<html>
<head>
    <title>Controle de Faltantes Pahc</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #111827
    );

    color:white;

    min-height:100vh;
}

/* HEADER */
.header{

    width:100%;

    padding:20px 40px;

    display:flex;
    align-items:center;

    background:
    rgba(15,23,42,0.8);

    backdrop-filter:blur(10px);

    border-bottom:
    1px solid rgba(255,255,255,0.05);

    position:sticky;

    top:0;

    z-index:100;
}

.logo{

    height:70px;

    margin-right:20px;
}

.header span{

    font-size:30px;

    font-weight:700;

    color:#38bdf8;
}

/* CONTAINER */
.container{

    width:95%;

    max-width:1400px;

    margin:30px auto;
}

/* FORM */
.form-box{

    background:
    rgba(30,41,59,0.75);

    backdrop-filter:blur(12px);

    border:
    1px solid rgba(255,255,255,0.06);

    border-radius:20px;

    padding:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.4);

    margin-bottom:30px;
}

/* TITULOS */
h3{

    margin-bottom:15px;

    font-size:24px;
}

/* GRID */
.grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    gap:15px;
}

/* FORMULÁRIO MODERNO */
.modern-grid{

    display:grid;

    grid-template-columns:
    2fr 2fr 1.5fr 1fr auto;

    gap:15px;

    align-items:center;
}

.modern-grid input,
.modern-grid select{

    height:60px;

    font-size:16px;

    background:#475569;

    border-radius:16px;

    padding:0 18px;

    border:2px solid transparent;

    transition:0.2s;
}

.modern-grid input:focus,
.modern-grid select:focus{

    border:2px solid #38bdf8;

    background:#52657e;
}

.modern-grid button{

    height:60px;

    width:60px;

    border-radius:16px;

    font-size:18px;
}

/* INPUT */
input,
select{

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    background:#334155;

    color:white;

    outline:none;

    font-size:15px;

    transition:0.2s;
}

input:focus,
select:focus{

    border:
    2px solid #38bdf8;

    background:#3b4d66;
}

/* BUTTON */
button{

    border:none;

    border-radius:12px;

    padding:12px 18px;

    font-weight:700;

    cursor:pointer;

    transition:0.2s;

    font-size:14px;
}

button:hover{
    transform:translateY(-2px);
}

.salvar{
    background:#22c55e;
    color:white;
}

.chegou{
    background:#3b82f6;
    color:white;
}

.alterar{
    background:#f59e0b;
    color:white;
}

.remover{
    background:#ef4444;
    color:white;
}

/* BOTÕES PRINCIPAIS */
.form-box > button{

    margin-top:20px;

    margin-right:10px;

    height:50px;

    padding:0 22px;

    border-radius:14px;
}

/* BUSCA */
#busca{

    width:100%;

    max-width:400px;

    margin-bottom:25px;
}

/* CARD */
.card{

    background:
    rgba(30,41,59,0.75);

    backdrop-filter:blur(12px);

    border:
    1px solid rgba(255,255,255,0.06);

    border-radius:20px;

    padding:25px;

    margin-bottom:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.4);
}

/* HEADER PEDIDO */
.pedido-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;
}

/* ITEM */
.item{

    background:#334155;

    padding:18px;

    border-radius:15px;

    margin-top:15px;

    line-height:1.8;
}

/* ÁREA DOS ITENS */
#itens .item{

    background:#263449;

    border-radius:20px;

    padding:20px;

    margin-top:20px;

    border:
    1px solid rgba(255,255,255,0.04);
}

/* STATUS */
.atrasado{
    border-left:5px solid #ef4444;
}

.hoje{
    border-left:5px solid #f59e0b;
}

.ok{
    border-left:5px solid #22c55e;
}

/* BADGES */
.badge{

    padding:8px 14px;

    border-radius:10px;

    font-size:12px;

    font-weight:bold;
}

.badge-ok{
    background:#22c55e;
}

.badge-pendente{
    background:#f59e0b;
}

/* BOTÕES */
.item button{

    margin-right:10px;

    margin-top:10px;
}

</style>

</head>

<body>

<div class="header">

    <img src="logo.png" class="logo">

    <span>Controle de Faltantes</span>

</div>

<div class="container">

<div class="form-box">

<div class="grid">
    <input id="numero" placeholder="Pedido">
    <input id="cliente" placeholder="Cliente">
</div>

<h3 style="margin-top:20px;">Itens</h3>

<div id="itens"></div>

<button onclick="addItem()">+ Adicionar Item</button>

<button class="salvar" onclick="criar()">
    Salvar
</button>

</div>

<input
    id="busca"
    placeholder="Buscar pedido..."
    onkeyup="carregar()">

<div id="lista"></div>

</div>

<script>

// ADD ITEM
function addItem() {

    const div = document.createElement("div");

    div.className = "item";

    div.innerHTML = `
        <div class="grid modern-grid">

            <input placeholder="Produto">

            <input placeholder="Código">

            <input type="date">

            <select>
                <option value="">Prateleira</option>

                <option>A</option>
                <option>B</option>
                <option>C</option>
                <option>D</option>
                <option>E</option>
                <option>F</option>
                <option>G</option>
                <option>H</option>
                <option>I</option>
                <option>J</option>
                <option>K</option>
                <option>L</option>
                <option>M</option>
            </select>

            <button
                class="remover"
                onclick="this.parentElement.parentElement.remove()">

                X

            </button>

        </div>
    `;

    document
        .getElementById("itens")
        .appendChild(div);
}

addItem();

// LOAD
async function carregar() {

    const res = await fetch("/pedidos");

    const dados = await res.json();

    const hoje = new Date();

    const busca =
        document
            .getElementById("busca")
            .value
            .toLowerCase();

    let pedidos = {};

    let alerta = "";

    dados.forEach(i => {

        if (!pedidos[i.numero]) {

            pedidos[i.numero] = {
                cliente: i.cliente,
                itens: []
            };
        }

        pedidos[i.numero].itens.push(i);
    });

    let html = "";

    for (let numero in pedidos) {

        if (
            busca &&
            !numero.toLowerCase().includes(busca)
        ) continue;

        const pedido = pedidos[numero];

        let todosChegaram =
            pedido.itens.every(
                i => i.status === "chegou"
            );

        html += `
        <div class="card">

            <div class="pedido-header">

                <h3>Pedido ${numero}</h3>

                <span class="badge ${
                    todosChegaram
                        ? 'badge-ok'
                        : 'badge-pendente'
                }">

                    ${
                        todosChegaram
                            ? 'PRONTO'
                            : 'PENDENTE'
                    }

                </span>

            </div>

            <b>Cliente:</b> ${pedido.cliente}

            <hr style="margin:15px 0;">
        `;

        pedido.itens.forEach(i => {

            let classe = "";

            let status = "";

            const prev =
                i.previsao
                    ? new Date(i.previsao)
                    : null;

            if (i.status === "chegou") {

                status = "✔ Chegou";

                classe = "ok";

            } else if (prev && prev < hoje) {

                status = "🔴 Atrasado";

                classe = "atrasado";

            } else if (
                prev &&
                prev.toDateString() === hoje.toDateString()
            ) {

                status = "⚠ Hoje";

                classe = "hoje";

            } else {

                status = "⏳ Aguardando";
            }

            html += `
            <div class="item ${classe}">

                <b>${i.produto}</b>

                | Código: ${i.codigo}

                | Local: ${i.localizacao || "-"}

                <br>

                Previsão: ${i.previsao || "-"}

                | Status: ${status}

                <br><br>

                <button
                    class="chegou"
                    onclick="chegou(${i.id})">

                    Chegou

                </button>

                <button
                    class="alterar"
                    onclick="alterar(${i.id})">

                    Alterar

                </button>

                <button
                    class="remover"
                    onclick="apagarPedido(${i.pedido_id})">

                    🗑️ Apagar Pedido

                </button>

            </div>
            `;
        });

        html += `</div>`;
    }

    document
        .getElementById("lista")
        .innerHTML = html;
}

// CREATE
async function criar() {

    const numero =
        document
            .getElementById("numero")
            .value;

    const cliente =
        document
            .getElementById("cliente")
            .value;

    const divs =
        document.querySelectorAll("#itens .item");

    let itens = [];

    divs.forEach(div => {

        const inputs =
            div.querySelectorAll("input");

        const select =
            div.querySelector("select");

        itens.push({

            produto: inputs[0].value,

            codigo: inputs[1].value,

            status:
                inputs[2].value
                    ? "faltante"
                    : "chegou",

            previsao:
                inputs[2].value || null,

            localizacao:
                select.value
        });
    });

    await fetch("/pedido", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            numero,
            cliente,
            itens
        })
    });

    carregar();
}

// UPDATE
async function chegou(id) {

    await fetch("/atualizar", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            id,
            status: "chegou",
            previsao: null
        })
    });

    carregar();
}

async function alterar(id) {

    const nova =
        prompt("Nova data YYYY-MM-DD:");

    if (!nova) return;

    await fetch("/atualizar", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            id,
            status: "faltante",
            previsao: nova
        })
    });

    carregar();
}

// APAGAR PEDIDO
async function apagarPedido(id) {

    const confirmar =
        confirm("Deseja apagar esse pedido?");

    if (!confirmar) return;

    await fetch(`/pedido/${id}`, {
        method: "DELETE"
    });

    alert("Pedido apagado!");

    carregar();
}

carregar();

</script>

</body>
</html>
